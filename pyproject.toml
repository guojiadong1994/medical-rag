[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag"
version = "1.0.0"
description = "Patient-Centric Multimodal Medical RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pymupdf>=1.26,<2.0",
]

[project.optional-dependencies]
embedding = [
    "numpy>=1.26,<3.0",
    "sentence-transformers>=5.1,<7.0",
]
reranker = [
    "torch>=2.2",
    "transformers>=4.49,<6.0",
]
milvus = [
    "pymilvus[milvus-lite]>=2.6,<4.0",
]
product = [
    "numpy>=1.26,<3.0",
    "sentence-transformers>=5.1,<7.0",
    "torch>=2.2",
    "transformers>=4.49,<6.0",
    "pymilvus[milvus-lite]>=2.6,<4.0",
]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
